<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholarship Information</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f4f4;
        }
        header {
            text-align: center;
            padding: 20px 0;
            background-color: #004a99;
            color: white;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .scholarship-card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .scholarship-card h2 {
            margin-top: 0;
            color: #004a99;
        }
        .details {
            margin-bottom: 10px;
        }
        .details strong {
            display: inline-block;
            width: 120px;
        }
        .apply-btn {
            display: inline-block;
            padding: 10px 15px;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        .apply-btn:hover {
            background-color: #218838;
        }
        #no-data-message {
            display: none; /* Hidden by default, shown if JS fails to load data */
            text-align: center;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Available Scholarships</h1>
    </header>

    <!-- Container where dynamic content will be inserted -->
    <main id="scholarship-container">
        <!-- Placeholder for loading state -->
        <p style="text-align: center;">Loading scholarship information...</p>
    </main>

    <!-- Message shown if no scholarships are found or JS fails -->
    <div id="no-data-message">
        <p>Currently, there are no scholarship listings available. Please check back later.</p>
    </div>

    <script>
        // Data structure representing scholarship information.
        // This replaces the dynamic data that would have come from Flask.
        const scholarshipData = [
            {
                title: "Academic Excellence Award",
                amount: "$5,000",
                deadline: "2024-05-30",
                description: "Awarded to students with a GPA of 3.8 or higher.",
                applyUrl: "#"
            },
            {
                title: "Community Growth Scholarship",
                amount: "$2,500",
                deadline: "2024-06-15",
                description: "For students demonstrating significant community service involvement.",
                applyUrl: "#"
            },
            {
                title: "STEM Innovation Grant",
                amount: "$10,000",
                deadline: "2024-07-01",
                description: "Supporting innovators in Science, Technology, Engineering, and Math.",
                applyUrl: "#"
            }
        ];

        // Function to render the scholarships to the page
        function renderScholarships(data) {
            const container = document.getElementById('scholarship-container');
            const noDataMsg = document.getElementById('no-data-message');
            
            // Clear placeholder text
            container.innerHTML = '';

            // Handle edge case where data is empty
            if (!data || data.length === 0) {
                container.style.display = 'none';
                noDataMsg.style.display = 'block';
                return;
            }

            // Iterate through data and generate HTML
            data.forEach(scholarship => {
                const card = document.createElement('div');
                card.className = 'scholarship-card';

                // Modern best practice: Using template literals to construct HTML
                card.innerHTML = `
                    <h2>${scholarship.title}</h2>
                    <div class="details"><strong>Amount:</strong> ${scholarship.amount}</div>
                    <div class="details"><strong>Deadline:</strong> ${scholarship.deadline}</div>
                    <p>${scholarship.description}</p>
                    <a href="${scholarship.applyUrl}" class="apply-btn" target="_blank" rel="noopener noreferrer">Apply Now</a>
                `;
                container.appendChild(card);
            });
        }

        // Simulate fetching dynamic data on load
        window.addEventListener('load', () => {
            // Basic error handling for visual assurance
            try {
                // To display 'no data' state, change to: renderScholarships([])
                renderScholarships(scholarshipData); 
            } catch (error) {
                console.error("Error rendering scholarships:", error);
                document.getElementById('scholarship-container').innerHTML = '<p style="color:red; text-align:center;">Failed to load scholarship data.</p>';
            }
        });
    </script>
</body>
</html>
